<!doctype html>
<html lang="en" style="background-color: #0e0c0b">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0c0b" />
    <meta name="color-scheme" content="dark" />
    <!-- A love letter, not a landing page: keep it out of search engines. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Feels like a native app when added to the iPhone home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="500 Days" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <title>Five Hundred Days ♡</title>
    <meta name="description" content="An album in five hundred days — made for exactly one person." />

    <!-- Link preview (iMessage, Messenger…). og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Five Hundred Days ♡" />
    <meta property="og:description" content="Someone made this just for you. Put the record on." />
    <meta property="og:image" content="https://godstr.github.io/five-hundred-days/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This little album needs JavaScript to play. ♡</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
